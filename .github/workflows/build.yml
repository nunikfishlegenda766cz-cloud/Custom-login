name: Build Minecraft Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Klonování repozitáře
      uses: actions/checkout@v4

    - name: Nastavení JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build pomocí Mavenu
      run: mvn clean package

    - name: Nahrání artefaktu (.jar)
      uses: actions/upload-artifact@v4
      with:
        name: SimpleLogin-jar
        path: target/SimpleLogin-1.0-SNAPSHOT.jar
